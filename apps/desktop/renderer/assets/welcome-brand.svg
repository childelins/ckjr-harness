<svg width="472" height="40" viewBox="0 0 472 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<!--
  CKJR Harness 欢迎页字标。

  为什么是文字而不是字形路径：本 fork 没有 CKJR 的字标矢量资源 —— 安装器用的是方形
  brand.png，直接铺进 472×40 的宽字标位会变形。文字渲染既品牌正确，又能随深浅色主题换色
  （与上游那把字标走 currentColor 的思路一致）。

  画布沿用上游的 472×40，替换后不会推动欢迎页布局。
-->
<style>
  :root {
    --ckjr-wordmark: #0f1115;
    --ckjr-badge-bg: #0f1115;
    --ckjr-badge-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ckjr-wordmark: #f9fafb;
      --ckjr-badge-bg: #f9fafb;
      --ckjr-badge-fg: #353638;
    }
  }
  .ckjr-wordmark {
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 600;
    font-size: 29px;
    letter-spacing: -0.4px;
  }
  .ckjr-badge {
    font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 2.4px;
  }
</style>

<!-- 内容整体右移 113px 居中：上游那把字标的内容中心在 x≈235.5，画布 472 宽；
     而 .brand 是 width:100%（welcome.css），不做这一步字标会显得贴左。 -->
<g transform="translate(113 0)">
  <!-- 主体：CKJR -->
  <text class="ckjr-wordmark" x="2" y="30" fill="var(--ckjr-wordmark)">CKJR</text>

  <!-- 后缀：反白 HARNESS 方块（与侧边栏品牌位、安装器 brand.png 同构） -->
  <rect x="107" y="10" width="137" height="25" rx="4" fill="var(--ckjr-badge-bg)"/>
  <text class="ckjr-badge" x="116" y="28" fill="var(--ckjr-badge-fg)">HARNESS</text>
</g>
</svg>
