# ⚠️ 生成物，请勿手工编辑：本文件由 apps/desktop/scripts/generate-ckjr-bundle-patch.ts
# 扫描 ckjr-plugins/ 里各插件的 cordis.patch.yml 合并而成。手工改动会被下一次
# 打包或 --check 覆盖/判定为不一致；要改行为，请改对应插件自己的 cordis.patch.yml。
#
# 为什么要合成这一层：桌面端 profile 只按名字选择 bundle，而一个 bundle 只会加载
# 它自己 dsh.bundle.patch 指到的文件——它 dependencies 里的包不会各自再贡献一层。
# 不合并的话，安装包只会装上插件、却不会把它们的行接进 profile。
#
# 合并顺序（目录名升序）：
#   @ckjr/dsh-ckjr-account         ← ckjr-plugins/dsh-ckjr-account
#   @ckjr/dsh-ckjr-brand           ← ckjr-plugins/dsh-ckjr-brand
#   @ckjr/dsh-ckjr-client-ui       ← ckjr-plugins/dsh-ckjr-client-ui
#   @ckjr/dsh-ckjr-llm             ← ckjr-plugins/dsh-ckjr-llm
#
# 本 bundle 必须排在 PROFILE_TEMPLATES.web.bundles 的最后：下面各插件的 disable
# 定位的是 dsh-base / dsh-web-app 已经 insert 进来的出厂行，patch 按 id 查找，
# 被定位的行必须已经存在。
#
# CKJR 各插件之间没有顺序依赖：disable 的目标都来自前两层，insert 的 id 互不相同。
# 若将来某个插件的 patch 需要引用另一个插件 insert 的行，就必须在这里引入显式顺序，
# 而不能继续只靠目录名排序。
#
# 重新生成：pnpm --filter @deepseek-ai/dsh-desktop run generate:ckjr-bundle-patch
# 校验一致：pnpm --filter @deepseek-ai/dsh-desktop run generate:ckjr-bundle-patch -- --check

# ===== @ckjr/dsh-ckjr-account  (ckjr-plugins/dsh-ckjr-account) =====
# @ckjr/dsh-ckjr-account bundle patch.
#
# Replaces the shipped DeepSeek account provider with the 创客匠人 (CKJR)
# implementation of the same `deepseekAccount` service. The shipped row is
# disabled rather than renamed: a patch addresses rows by id and replaces their
# whole `config`, so the replacement takes a new id of its own.
- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account-platform'
  disabled: true

- insert:
    - id: ckjr-account
      name: '@ckjr/dsh-ckjr-account'
      config:
        # lecturer-api (the merchant SaaS): PKCE authorize/token endpoints.
        authOrigin: 'https://kpapi-cs.ckjr001.com'
        # ckjr-agent gateway root; the LLM adapter appends `/v1/messages`.
        gatewayOrigin: 'https://agent-cs.myckjr.com'
        # Browser destinations the shell opens from the account surface.
        usageUrl: 'https://kpapi-cs.ckjr001.com/'
        topUpUrl: 'https://kpapi-cs.ckjr001.com/'
        clientId: 'dsh-desktop'

# ===== @ckjr/dsh-ckjr-brand  (ckjr-plugins/dsh-ckjr-brand) =====
# @ckjr/dsh-ckjr-brand bundle patch.
#
# 本层是"出厂品牌与隐私默认"：两件事都属于"上游有开关，但不该让商家用户自己去关"的项。
#
# ── 1. disable `session-log-deepseek` ─────────────────────────────────────────
#
# 出厂行在 `packages/bundle/base/cordis.patch.yml:43`。它是「在使用官方模型 API 时
# 上传 Session Log」那个开关的宿主：默认 `enabled: true`，把会话日志后缀挂在请求的
# `dsh_session_log` 字段上发出去（`packages/session/session-log-deepseek/src/index.ts:185-187`，
# 判据只有 `enabled` 与会话是否存在，**不按 provider 区分**）。
#
# 关键：它在**我们的 CKJR 网关上同样生效**。该字段由 DeepSeek Messages 适配器统一注入
# （`packages/llm/llm-deepseek/src/host.ts:36` 的 `prepareExtensions`），而
# `dsh-ckjr-llm` 注册的 `ckjr` 路由复用的正是这个适配器（`registerDeepSeekProvider`）。
# 也就是说：不 disable，商家每次对话都会把会话日志发给网关，而不只是发给官方 API。
#
# disable 这一行同时满足用户的两条要求，缺一不可：
#
#   * **默认关闭** —— 行不加载，就不存在任何上传路径。
#     比 `config: {enabled: false}` 更彻底：后者只是"不发"，插件仍然活着、开关仍可被打开。
#   * **不要显示** —— 浏览器侧那一行来自 `@deepseek-ai/dsh-client-ui-settings-session-log`，
#     它必须靠 `ctx.configForms.whileServed(['session-log-deepseek'], …)` 才注册
#     `settings.general.item`（`packages/client/ui-settings-session-log/src/client/index.ts:36-37`），
#     而 settings 只把 **fiber 处于 ACTIVE** 的条目报成命名空间
#     （`packages/settings/settings/src/index.ts:303-307`）。行被 disable 后命名空间不再被
#     服务，那一行**根本不会被注册**。
#
#     这是上游支持的机制，不是遮蔽或隐藏 hack：`packages/client/ui-settings/README.md:38`
#     写明 "A deployment that never composed the owner therefore shows no trace of the page"。
#     对照来看，`dsh-ckjr-client-ui` 抢 `settings.models.sign-in` 座位时才是真的只能整体
#     disable 占位者——那一条的副作用是被迫接受的，而这一条恰好正是我们想要的结果。
#
# 为什么不用 `config: {enabled: false}`：那样只是默认关闭，命名空间照旧被服务、
# 设置项仍然显示，而用户要求的是"默认关闭 **并且** 不要显示"。
#
# 未一并处理（留给用户决定）：`session-telemetry-otel`
# （`packages/bundle/base/cordis.patch.yml:204`）是**另一条**独立的上传路径，
# 默认 `mode: FEEDBACK_ONLY`、默认发往 `dsh-otel-collector.deepseeksvc.com`，
# 且它**没有**设置项。关它属于行为性变更，本次未动。
#
# ── 2. insert 本插件行 ───────────────────────────────────────────────────────
#
# `dsh-ckjr-brand/index.js` 把系统提示词第一句换成 CKJR 品牌（为什么只能这么做，
# 那段理由写在该文件的头部注释里）。
#
# 本层不新增任何用户可见的设置项：本插件没有 Config，而 settings 只把有 schema 的行报成
# 命名空间，所以它不会出现在设置页里。
- id: session-log-deepseek
  name: '@deepseek-ai/dsh-session-log-deepseek'
  disabled: true

# 另一条独立上传路径：OpenTelemetry 遥测（默认 mode: FEEDBACK_ONLY，
# 默认发往 dsh-otel-collector.deepseeksvc.com，**没有设置项**，用户关不了）。
# 出处 packages/bundle/base/cordis.patch.yml:204；上游有测试断言该行可被 disabled
# （apps/cli/tests/resolved-profile-boot.spec.ts:165），故这是受支持的开关方式。
- id: session-telemetry-otel
  name: '@deepseek-ai/dsh-session-telemetry-otel'
  disabled: true

- insert:
    - id: ckjr-brand
      name: '@ckjr/dsh-ckjr-brand'

# ===== @ckjr/dsh-ckjr-client-ui  (ckjr-plugins/dsh-ckjr-client-ui) =====
# @ckjr/dsh-ckjr-client-ui bundle patch.
#
# 两件事：
#
# 1. disable 出厂的 ui-settings-account。
#    `settings.models.sign-in` 由 ui-settings-models 声明为 kind:"single"（见其
#    lib/client.js 的 declare 与 renderSlot），而出厂账号插件正是在这里注册
#    SignInDialog 占住座位（ui-settings-account 的 lib/client.js:4469
#    `ctx.slots.inject("settings.models.sign-in", ...)`）。single 座位没有更细粒度的
#    让位方式，只能让占位者整体不加载。
#    副作用（有意接受）：DeepSeek 的账号设置页、侧边栏账号菜单、额度/充值提示与首启
#    引导一并消失——内部品牌化部署本就不该出现这些；登录入口与门禁由本插件接管。
#
# 2. insert 本插件行。
#    模块系统按该行扫描包的 `dsh.client` 声明，浏览器侧 bundle 即作为
#    /plugins/@ckjr/dsh-ckjr-client-ui/client.js 提供；Host 半边不注册任何东西。
- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  disabled: true
- insert:
    - id: ckjr-client-ui
      name: '@ckjr/dsh-ckjr-client-ui'

# ===== @ckjr/dsh-ckjr-llm  (ckjr-plugins/dsh-ckjr-llm) =====
# @ckjr/dsh-ckjr-llm bundle patch.
#
# Registers the `ckjr` LLM route: the ckjr-agent gateway's `/v1/messages`
# endpoint, authenticated with `Authorization: Bearer <CKJR desktop JWT>`.
#
# `baseURL` is the gateway ROOT: the DeepSeek Messages adapter appends
# `/v1/messages` itself (an exact trailing `/v1` would be reused instead), and
# this bundle appends `/v1/models` to the same root.
#
# 模型清单来自网关的 `GET /v1/models`（`index.js` 现取 + 进程内缓存），这里不再
# 写死档位名：之前的 `标准` / `快速` 与网关上的真实模型无关，会误导用户。
# 取不到时插件给出“暂时取不到模型列表”的明确状态，**不会**退回写死清单。
#
# 本层同时负责「出厂只剩创客匠人一个服务商」，三处改动缺一不可：
#
# 1. disable `llm-deepseek`。这一行是 `@deepseek-ai/dsh-llm-deepseek-api-key`
#    （见 packages/bundle/base/cordis.patch.yml:525），它注册的 provider id 是
#    **`deepseek-official`**、显示名 `DeepSeek` —— 正是设置 → 模型 里那个带红点
#    （apiKeyEnv 未配置）的 `DeepSeek`。由本插件 disable 而不是 account 插件：
#    这就是「去掉一个竞争的模型路由」，与 `ckjr` 路由的注册同属模型这一侧，改在
#    一起才能一眼看出「本层注册了 ckjr、并摘掉了 deepseek」。
#
# 2. disable `llm-deepseek-account`（provider `deepseek-account`，显示名
#    `DeepSeek Account`）。它在本部署里本来就是哑的：它经 `deepseekAccount`
#    服务取令牌，而 `dsh-ckjr-account` 的 `resolveToken` 只认 CKJR 网关 origin，
#    对 api.deepseek.com 返回 undefined，于是 discoverModels 得到空清单、被
#    `buildModelCatalog` 按「空分组」过滤掉，界面上看不见。但它在 `ctx.llm` 里
#    仍然是活的注册项，留着只会在日志/失败面里多一个 DeepSeek 品牌；既然要求
#    「只保留创客匠人」，一并摘掉。
#
# 3. 把默认模型从 `deepseek-official/deepseek-flash` 挪到 `ckjr`。
#    `packages/bundle/base/cordis.patch.yml:82` 的 `agent-default-model` 出厂值是
#    `provider: deepseek-official` —— provider 一旦被 disable，新会话的默认选择就
#    指向一个不存在的路由：模型选择器显示为不可用，首次发消息会被
#    `session-controller` 的 `requireModel()` 以 `session/model-unavailable` 拒绝
#    （`packages/api/session-controller/src/commands.ts:380`）。所以这两件事必须同层。
#    注意 `initializeDefaultModel()`（会自动挑第一个可用模型）硬编码了
#    `deepseek-account`，但它的唯一调用方是 `ui-settings-account`，已被
#    `dsh-ckjr-client-ui` disable，不会运行，因此不能指望它兜底。
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: llm-deepseek-account
  name: '@deepseek-ai/dsh-llm-deepseek-account'
  disabled: true

# 新会话的默认落点。patch 按 id 定位并**整体替换** config，所以 provider 与 model
# 都要给全（该行 schema 里两者皆 required，`reasoningEffort` 可选）。
#
# model 用 `qwen3.8-max`：2026-10-02 用桌面端已存令牌实测
# `GET https://agent-cs.myckjr.com/v1/models` 返回
# `[qwen3.8-max "Qwen3.8 Max", qwen3.7-plus "Qwen3.7 Plus"]`（各 1,000,000 上下文）。
# 网关模型清单是现取的，这里写死的是**默认选中项**而不是清单本身：换成网关上的
# 另一个 id 只影响首启默认值；若网关将来下线 `qwen3.8-max`，用户仍可在选择器里
# 改选其它模型，`ckjr` 路由也不会因此加载失败（`resolveModel` 对未编目模型照常放行）。
- id: agent-default-model
  config:
    provider: ckjr
    model: qwen3.8-max

- insert:
    - id: ckjr-llm
      name: '@ckjr/dsh-ckjr-llm'
      config:
        baseURL: 'https://agent-cs.myckjr.com'
        # 保留但留空：网关不披露的**能力**（`inputModalities`、单模型 `maxTokens`）
        # 已由插件内置的 `KNOWN_MODEL_CAPABILITIES` 按 id 补齐，这里不必重复。
        # 只在需要按部署**覆盖**某个模型时才加条目——可以显式写
        # `inputModalities: ['text']` 把某个模型的图片能力关掉。
        # 合并时名称与上下文窗口始终以网关为准。
        models: []
        # 模型清单的进程内缓存时长（毫秒）。模型列表不会每次开设置页都重新拉取；
        # 过期后由下一次读取触发后台刷新，发消息这条路径不会被网络往返卡住。
        modelCacheTtlMs: 300000
        # 单次请求的输出上限。沿用此前实测可用的 32768，而不是上游默认的
        # 256000：`/v1/models` 不披露输出上限，而这个路由后面是 Qwen。
        maxTokens: 32768
