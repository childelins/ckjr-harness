# ⚠️ 生成物，请勿手工编辑：本文件由 apps/desktop/scripts/generate-ckjr-bundle-patch.ts
# 扫描 ckjr-plugins/ 里各插件的 cordis.patch.yml 合并而成。手工改动会被下一次
# 打包或 --check 覆盖/判定为不一致；要改行为，请改对应插件自己的 cordis.patch.yml。
#
# 为什么要合成这一层：桌面端 profile 只按名字选择 bundle，而一个 bundle 只会加载
# 它自己 dsh.bundle.patch 指到的文件——它 dependencies 里的包不会各自再贡献一层。
# 不合并的话，安装包只会装上插件、却不会把它们的行接进 profile。
#
# 合并顺序（目录名升序）：
#   @ckjr/dsh-ckjr-account         ← ckjr-plugins/dsh-ckjr-account
#   @ckjr/dsh-ckjr-client-ui       ← ckjr-plugins/dsh-ckjr-client-ui
#   @ckjr/dsh-ckjr-llm             ← ckjr-plugins/dsh-ckjr-llm
#
# 本 bundle 必须排在 PROFILE_TEMPLATES.web.bundles 的最后：下面各插件的 disable
# 定位的是 dsh-base / dsh-web-app 已经 insert 进来的出厂行，patch 按 id 查找，
# 被定位的行必须已经存在。
#
# CKJR 各插件之间没有顺序依赖：disable 的目标都来自前两层，insert 的 id 互不相同。
# 若将来某个插件的 patch 需要引用另一个插件 insert 的行，就必须在这里引入显式顺序，
# 而不能继续只靠目录名排序。
#
# 重新生成：pnpm --filter @deepseek-ai/dsh-desktop run generate:ckjr-bundle-patch
# 校验一致：pnpm --filter @deepseek-ai/dsh-desktop run generate:ckjr-bundle-patch -- --check

# ===== @ckjr/dsh-ckjr-account  (ckjr-plugins/dsh-ckjr-account) =====
# @ckjr/dsh-ckjr-account bundle patch.
#
# Replaces the shipped DeepSeek account provider with the 创客匠人 (CKJR)
# implementation of the same `deepseekAccount` service. The shipped row is
# disabled rather than renamed: a patch addresses rows by id and replaces their
# whole `config`, so the replacement takes a new id of its own.
- id: deepseek-account
  name: '@deepseek-ai/dsh-deepseek-account-platform'
  disabled: true

- insert:
    - id: ckjr-account
      name: '@ckjr/dsh-ckjr-account'
      config:
        # lecturer-api (the merchant SaaS): PKCE authorize/token endpoints.
        authOrigin: 'https://kpapi-cs.ckjr001.com'
        # ckjr-agent gateway root; the LLM adapter appends `/v1/messages`.
        gatewayOrigin: 'https://agent-cs.myckjr.com'
        # Browser destinations the shell opens from the account surface.
        usageUrl: 'https://kpapi-cs.ckjr001.com/'
        topUpUrl: 'https://kpapi-cs.ckjr001.com/'
        clientId: 'dsh-desktop'

# ===== @ckjr/dsh-ckjr-client-ui  (ckjr-plugins/dsh-ckjr-client-ui) =====
# @ckjr/dsh-ckjr-client-ui bundle patch.
#
# 两件事：
#
# 1. disable 出厂的 ui-settings-account。
#    `settings.models.sign-in` 由 ui-settings-models 声明为 kind:"single"（见其
#    lib/client.js 的 declare 与 renderSlot），而出厂账号插件正是在这里注册
#    SignInDialog 占住座位（ui-settings-account 的 lib/client.js:4469
#    `ctx.slots.inject("settings.models.sign-in", ...)`）。single 座位没有更细粒度的
#    让位方式，只能让占位者整体不加载。
#    副作用（有意接受）：DeepSeek 的账号设置页、侧边栏账号菜单、额度/充值提示与首启
#    引导一并消失——内部品牌化部署本就不该出现这些；登录入口与门禁由本插件接管。
#
# 2. insert 本插件行。
#    模块系统按该行扫描包的 `dsh.client` 声明，浏览器侧 bundle 即作为
#    /plugins/@ckjr/dsh-ckjr-client-ui/client.js 提供；Host 半边不注册任何东西。
- id: ui-settings-account
  name: '@deepseek-ai/dsh-client-ui-settings-account'
  disabled: true
- insert:
    - id: ckjr-client-ui
      name: '@ckjr/dsh-ckjr-client-ui'

# ===== @ckjr/dsh-ckjr-llm  (ckjr-plugins/dsh-ckjr-llm) =====
# @ckjr/dsh-ckjr-llm bundle patch.
#
# Registers the `ckjr` LLM route: the ckjr-agent gateway's `/v1/messages`
# endpoint, authenticated with `Authorization: Bearer <CKJR desktop JWT>`.
#
# `baseURL` is the gateway ROOT: the DeepSeek Messages adapter appends
# `/v1/messages` itself (an exact trailing `/v1` would be reused instead), and
# this bundle appends `/v1/models` to the same root.
#
# 模型清单来自网关的 `GET /v1/models`（`index.js` 现取 + 进程内缓存），这里不再
# 写死档位名：之前的 `标准` / `快速` 与网关上的真实模型无关，会误导用户。
# 取不到时插件给出“暂时取不到模型列表”的明确状态，**不会**退回写死清单。
- insert:
    - id: ckjr-llm
      name: '@ckjr/dsh-ckjr-llm'
      config:
        baseURL: 'https://agent-cs.myckjr.com'
        # 保留但留空：只有在需要为某个模型补充**网关未披露**的能力
        # （如 `inputModalities`、单模型 `maxTokens`）时才按 id 添加条目。
        # 合并时名称与上下文窗口始终以网关为准。
        models: []
        # 模型清单的进程内缓存时长（毫秒）。模型列表不会每次开设置页都重新拉取；
        # 过期后由下一次读取触发后台刷新，发消息这条路径不会被网络往返卡住。
        modelCacheTtlMs: 300000
        # 单次请求的输出上限。沿用此前实测可用的 32768，而不是上游默认的
        # 256000：`/v1/models` 不披露输出上限，而这个路由后面是 Qwen。
        maxTokens: 32768
